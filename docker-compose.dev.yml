services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://crechemate:${POSTGRES_PASSWORD}@postgres:5432/crechemate
      - JWT_SECRET=${JWT_SECRET}
      - CHILD_DATA_ENCRYPTION_KEY=${CHILD_DATA_ENCRYPTION_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PAYMENTS_TEST_MODE=${PAYMENTS_TEST_MODE}
      # Origins allowed to call the API — set to this PC's address(es) in .env
      # (localhost for single-machine use, plus the LAN IP for other devices).
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5001}
      # This overlay exposes the API directly on the LAN (no nginx in front), so
      # don't trust X-Forwarded-For — otherwise any client could spoof its IP in
      # the audit log and rate-limit key. The prod overlay omits this (API is
      # behind nginx on 127.0.0.1) so XFF from the trusted proxy is honoured.
      - TRUST_PROXY=false
    ports:
      # All interfaces so the onsite PC's own browser AND other devices on the
      # LAN can reach it. The box sits behind a router that forwards nothing
      # but 80/443, so this stays internal.
      - "5000:5000"
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle at build time — must be an address the
        # CLIENT's browser can reach. localhost for single-machine use; set to
        # the PC's LAN IP in .env (and rebuild web) for access from other
        # devices onsite.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "5001:3000"
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
