# CrecheMate — CLIENT-ONLY external access for the onsite facility server.
#
# Use this on the facility server, where the staff app stays on the LAN and the
# ONLY thing exposed to the internet is the parent booking/registration site.
# nginx serves only /book and /intake here; every other path redirects to the
# booking page, so the staff app is never reachable from the internet.
#
# Replace crecheclient.tectel.com.au with your domain, then let certbot add TLS:
#   sudo certbot --nginx -d crecheclient.tectel.com.au
#
#   crecheclient.<domain>  → parent pages (127.0.0.1:5001, /book + /intake)
#   /api/                  → API          (127.0.0.1:5000, /api prefix stripped)

server {
    listen 80;
    server_name crecheclient.tectel.com.au;
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Public API used by the booking / registration pages.
    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
    }

    # Land parents on the booking page.
    location = / { return 302 /book; }

    # The only pages served here (+ their assets). No trailing slash on
    # proxy_pass so the path is passed through unchanged.
    location /book          { proxy_pass http://127.0.0.1:5001; }
    location /intake        { proxy_pass http://127.0.0.1:5001; }
    location /_next/        { proxy_pass http://127.0.0.1:5001; }
    location = /favicon.ico { proxy_pass http://127.0.0.1:5001; }

    # Anything else → booking page (staff app is not exposed).
    location / { return 302 /book; }
}
