# CrecheMate — external access via the box's existing nginx (same pattern as
# irentit.conf / racq.conf). Only nginx (80/443) is internet-reachable; the app
# ports stay on 127.0.0.1. Certbot adds the TLS + port-80-redirect blocks.
#
#   crechemate.tectel.com.au    → staff/admin app   (127.0.0.1:5001)
#   crecheclient.tectel.com.au  → parent pages only (127.0.0.1:5001, /book + /intake)
#   both  /api/                 → API               (127.0.0.1:5000, /api prefix stripped)
#
# The web bundle calls the API same-origin at /api, so no CORS and it works
# under either hostname. Staff pages are login-protected (JWT); the client host
# additionally only serves the parent-facing pages.

# ── Staff / admin ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name crechemate.tectel.com.au;
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # API (strip the /api prefix).
    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
    }

    # Full app.
    location / {
        proxy_pass http://127.0.0.1:5001/;
    }
}

# ── Client / parent ──────────────────────────────────────────────────────
# Only the parent-facing pages are exposed here; any other path is sent to the
# booking page so the staff app isn't served on the client hostname at all.
server {
    listen 80;
    server_name crecheclient.tectel.com.au;
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Public API used by the booking / registration pages.
    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
    }

    # Land parents on the booking page.
    location = / { return 302 /book; }

    # The only pages served on the client host (+ their assets). No trailing
    # slash on proxy_pass so the path is passed through unchanged.
    location /book          { proxy_pass http://127.0.0.1:5001; }
    location /intake        { proxy_pass http://127.0.0.1:5001; }
    location /_next/        { proxy_pass http://127.0.0.1:5001; }
    location = /favicon.ico { proxy_pass http://127.0.0.1:5001; }

    # Anything else (staff routes, etc.) → booking page.
    location / { return 302 /book; }
}
